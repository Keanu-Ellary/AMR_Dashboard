name: Continuous Integration - Backend and Frontend Unit Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './amr-dashboard/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./amr-dashboard

      - name: Lint
        run: npm run lint
        working-directory: ./amr-dashboard
        continue-on-error: true

      - name: Run Backend Unit Tests
        run: npm run test:backend-unit
        working-directory: ./amr-dashboard

      - name: Run Frontend Unit Tests
        run: npm run test:frontend-unit
        working-directory: ./amr-dashboard
        