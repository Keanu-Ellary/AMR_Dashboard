name: Continuous Integration - Integration and E2E Tests
on:
  push:
    branches: [main, dev, fix/tests]
  pull_request:
    branches: [main, dev, fix/tests]

jobs:
  test_suite:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: './amr-dashboard/package-lock.json'

    - name: Create.env file
      run: |
        echo "DATABASE_URL=${{secrets.DATABASE_URL}}" >> .env
        echo "DATABASE_URL_TEST=${{secrets.DATABASE_URL_TEST}}" >> .env
        echo "POSTGRES_USER=${{secrets.POSTGRES_USER}}" >> .env
        echo "POSTGRES_PASSWORD=${{secrets.POSTGRES_PASSWORD}}" >> .env
        echo "POSTGRES_DB=${{secrets.POSTGRES_DB}}" >> .env
        echo "MINIO_ENDPOINT=${{secrets.MINIO_ENDPOINT}}" >> .env
        echo "MINIO_ACCESS_KEY=${{secrets.MINIO_ACCESS_KEY}}" >> .env
        echo "MINIO_SECRET_KEY=${{secrets.MINIO_SECRET_KEY}}" >> .env
        echo "MINIO_BUCKET=${{secrets.MINIO_BUCKET}}" >> .env
        echo "JWT_SECRET=${{secrets.JWT_SECRET}}" >> .env
        echo "ALGAE_DETECTOR_LAMBDA_URL=${{secrets.ALGAE_DETECTOR_LAMBDA_URL}}" >> .env
        echo "AWS_ACCESS_KEY_ID=${{secrets.AWS_ACCESS_KEY_ID}}" >> .env
        echo "AWS_SECRET_ACCESS_KEY=${{secrets.AWS_SECRET_ACCESS_KEY}}" >> .env
        echo "AWS_DEFAULT_REGION=${{secrets.AWS_DEFAULT_REGION}}" >> .env
        echo "E2E_ADMIN_EMAIL=${{secrets.E2E_ADMIN_EMAIL}}" >> .env
        echo "E2E_ADMIN_PASSWORD=${{secrets.E2E_ADMIN_PASSWORD}}" >> .env
        echo "EMAIL_APP_PASS=${{secrets.EMAIL_APP_PASS}}" >> .env
        echo "EMAIL_USER=${{secrets.EMAIL_USER}}" >> .env
        echo "USE_MINIO=true" >> .env
      working-directory: ./amr-dashboard

    - name: Start Docker
      run: docker compose up db minio ai-lambda -d
      working-directory: ./amr-dashboard

    - name: Wait for Database
      run: |
        until docker exec $(docker ps -q -f name=db) pg_isready -U postgres; do
          echo "Waiting for database..."
          sleep 2
        done

    - name: Wait for MinIO
      run: |
        for i in {1..30}; do
          if curl -sf http://localhost:9000/minio/health/live; then
            echo "MinIO ready"
            break
          fi
          echo "Waiting for MinIO" 
          sleep 2
        done

    - name: Create MinIO bucket
      run: |
        docker run --rm --network host \
          -e MC_HOST_local="http://${{secrets.MINIO_ACCESS_KEY}}:${{secrets.MINIO_SECRET_KEY}}@localhost:9000"
          minio/mc mb local/${{secrets.MINIO_BUCKET}} --ignore-existing

    - name: Install dependencies
      run: npm ci
      working-directory: ./amr-dashboard

    - name: Prisma Generate
      run: npx prisma generate
      working-directory: ./amr-dashboard

    - name: Run Migrations
      run: npx prisma migrate deploy
      working-directory: ./amr-dashboard

    - name: Seed Database
      run: npx prisma db seed
      working-directory: ./amr-dashboard

    - name: Build and Start Next.js Application
      run: |
        npm run build
        npm run start &
      working-directory: ./amr-dashboard

    # Integration tests
    - name: Run Integration Tests
      run: npm run test:integration
      working-directory: ./amr-dashboard

    # Run E2E tests
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright

    - name: Install playwright dependencies
      working-directory: ./amr-dashboard
      run: npx playwright install

    - name: Run E2E Tests
      run: npx playwright test
      working-directory: ./amr-dashboard

    # Upload outcomes
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: ./amr-dashboard/test-results/
        retention-days: 30